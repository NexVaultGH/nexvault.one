<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#c9a84c"/>
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Dark background -->
  <rect width="1200" height="630" fill="#05050f"/>

  <!-- Scanlines -->
  <g opacity="0.15">
    <rect x="0" y="0" width="1200" height="2" fill="#00f0ff" opacity="0.08"/>
    <rect x="0" y="100" width="1200" height="1" fill="#00f0ff" opacity="0.05"/>
    <rect x="0" y="250" width="1200" height="1" fill="#00f0ff" opacity="0.05"/>
    <rect x="0" y="400" width="1200" height="1" fill="#00f0ff" opacity="0.05"/>
    <rect x="0" y="550" width="1200" height="1" fill="#00f0ff" opacity="0.05"/>
  </g>

  <!-- Grid lines (perspective) -->
  <g opacity="0.08" stroke="#00f0ff" stroke-width="0.5" fill="none">
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="550" x2="1200" y2="550"/>
    <line x1="600" y1="380" x2="100" y2="630"/>
    <line x1="600" y1="380" x2="350" y2="630"/>
    <line x1="600" y1="380" x2="600" y2="630"/>
    <line x1="600" y1="380" x2="850" y2="630"/>
    <line x1="600" y1="380" x2="1100" y2="630"/>
  </g>

  <!-- Top cyan glow line -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#cyanLine)"/>

  <!-- Border -->
  <rect x="24" y="24" width="1152" height="582" rx="12" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.15"/>

  <!-- Logo mark (cyan neon) -->
  <rect x="80" y="80" width="64" height="64" rx="8" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.5"/>
  <text x="112" y="126" text-anchor="middle" font-family="Georgia,serif" font-size="38" font-weight="700" fill="#00f0ff" filter="url(#glow)">V</text>

  <!-- Brand name -->
  <text x="164" y="125" font-family="monospace" font-size="20" letter-spacing="6" fill="#00f0ff" opacity="0.9">NEXVAULT</text>

  <!-- USDX SAVINGS PROTOCOL label -->
  <text x="80" y="220" font-family="monospace" font-size="16" letter-spacing="8" fill="#00f0ff" opacity="0.8">USDX SAVINGS PROTOCOL</text>

  <!-- Main headline: Sovereign Yield Banking (gradient) -->
  <text x="80" y="310" font-family="Georgia,serif" font-size="72" font-weight="400" fill="#f5f5ff">Sovereign</text>
  <text x="80" y="390" font-family="Georgia,serif" font-size="72" font-weight="400" font-style="italic" fill="url(#cyanGrad)" filter="url(#glow)">Yield Banking</text>

  <!-- Sub description -->
  <text x="80" y="450" font-family="monospace" font-size="18" fill="#8888aa">Earn up to 4.38% APY on locked USDX &#8212; backed by U.S. Treasury yield</text>

  <!-- Stat box: 258 passing tests -->
  <rect x="80" y="490" width="180" height="72" rx="6" fill="rgba(0,240,255,0.03)" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <text x="170" y="525" text-anchor="middle" font-family="Georgia,serif" font-size="32" fill="#00f0ff" filter="url(#glow)">258</text>
  <text x="170" y="548" text-anchor="middle" font-family="monospace" font-size="10" letter-spacing="2" fill="#00f0ff" opacity="0.7">PASSING TESTS</text>

  <!-- Tier pills (right side) -->
  <g>
    <rect x="280" y="490" width="140" height="36" rx="4" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <text x="350" y="513" text-anchor="middle" font-family="monospace" font-size="13" fill="#00f0ff">1-Year &#8212; 3.75%</text>
    <rect x="430" y="490" width="140" height="36" rx="4" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    <text x="500" y="513" text-anchor="middle" font-family="monospace" font-size="13" fill="#00f0ff">3-Year &#8212; 3.92%</text>
    <rect x="580" y="490" width="140" height="36" rx="4" fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.6"/>
    <text x="650" y="513" text-anchor="middle" font-family="monospace" font-size="13" fill="#c9a84c" filter="url(#glow)">5-Year &#8212; 4.38%</text>
  </g>

  <!-- URL -->
  <text x="80" y="590" font-family="monospace" font-size="14" letter-spacing="4" fill="#5a5a7a">NEXVAULT.ONE</text>

  <!-- Decorative neon dot cluster (right) -->
  <g opacity="0.8">
    <circle cx="1080" cy="150" r="3" fill="#00f0ff" filter="url(#glow)"/>
    <circle cx="1050" cy="180" r="2" fill="#00f0ff" opacity="0.6"/>
    <circle cx="1100" cy="200" r="2" fill="#c9a84c" opacity="0.7"/>
    <circle cx="1020" cy="220" r="1.5" fill="#00f0ff" opacity="0.5"/>
    <circle cx="1080" cy="250" r="2.5" fill="#00f0ff" opacity="0.7" filter="url(#glow)"/>
  </g>

  <!-- Large cyan glow orb (right side) -->
  <circle cx="1050" cy="400" r="180" fill="#00f0ff" opacity="0.04"/>
  <circle cx="1080" cy="350" r="100" fill="#c9a84c" opacity="0.03"/>

  <!-- Bottom cyan glow line -->
  <rect x="0" y="628" width="1200" height="2" fill="url(#cyanLine)"/>
</svg>
