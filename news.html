  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@300;400;500&family=DM+Serif+Display:ital@0;1&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
  <style>
    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:18px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(201,168,76,.06);background:rgba(5,6,10,.8);backdrop-filter:blur(20px)}
    .nav-logo{display:flex;align-items:center;gap:12px}
    .nav-logomark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#c9a84c,#8b6914);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:#05060a}
    .nav-name{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;letter-spacing:.12em;color:#e8e2d6}
    .nav-pill-link{padding:4px 12px;border-radius:20px;border:1px solid rgba(201,168,76,.2);background:rgba(201,168,76,.06);color:#c9a84c;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.1em;font-weight:600;text-decoration:none;transition:all .2s;white-space:nowrap}
    .nav-pill-link:hover{background:rgba(201,168,76,.14)}
    .nav-launch-btn{padding:8px 18px;border-radius:9px;border:1px solid rgba(201,168,76,.35);background:rgba(201,168,76,.08);color:#c9a84c;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;font-weight:600;text-decoration:none;transition:all .2s;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
    .nav-launch-btn:hover{background:rgba(201,168,76,.15)}
    .dot-live{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px rgba(74,222,128,.4)}
    footer{text-align:center;padding:40px 20px;font-size:11px;color:#5a5650;letter-spacing:.1em;border-top:1px solid rgba(255,255,255,.04)}

    /* ── Hero ── */
    .news-hero {
      min-height: 50vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 140px 24px 80px;
    }
    .news-hero-content { max-width: 680px; }

    /* ── Filter bar ── */
    .filter-bar {
      max-width: 900px; margin: 0 auto 48px; padding: 0 24px;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 20px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); font-family: var(--font); font-size: 11px;
      letter-spacing: 0.08em; font-weight: 500; cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
    .filter-btn.active { border-color: var(--gold); color: var(--gold); background: rgba(201,168,76,0.06); }

    /* ── Tag pills ── */
    .tag-pill {
      display: inline-block; padding: 3px 10px; border-radius: 4px;
      font-size: 9px; letter-spacing: 0.12em; font-weight: 700;
    }
    .tag-protocol { background: rgba(201,168,76,0.10); color: #c9a84c; }
    .tag-defi     { background: rgba(99,102,241,0.10); color: #818cf8; }
    .tag-market   { background: rgba(34,197,94,0.08);  color: #4ade80; }
    .tag-education{ background: rgba(56,189,248,0.08); color: #38bdf8; }
    .tag-security { background: rgba(239,68,68,0.08);  color: #f87171; }
    .tag-ai       { background: rgba(168,85,247,0.10); color: #c084fc; }

    /* ── Article list ── */
    .news-list {
      max-width: 900px; margin: 0 auto; padding: 0 24px;
    }

    .news-item {
      display: block; padding: 40px 0; border-bottom: 1px solid var(--border);
      text-decoration: none; transition: opacity 0.2s;
    }
    .news-item:first-child { border-top: 1px solid var(--border); }
    .news-item:hover { opacity: 0.75; }

    .news-item-meta {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }

    .news-item-date {
      font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .news-item-title {
      font-family: var(--font); font-weight: 300; font-size: clamp(20px, 3vw, 32px);
      color: var(--text); line-height: 1.25; letter-spacing: -0.01em;
    }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 64px; padding: 0 24px; flex-wrap: wrap;
    }
    .page-btn {
      width: 40px; height: 40px; border-radius: 6px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); font-family: var(--font-mono); font-size: 12px;
      font-weight: 500; cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
    .page-btn.active { border-color: var(--gold); color: var(--gold); }
    .page-btn:disabled { opacity: 0.25; cursor: default; pointer-events: none; }
    .page-info {
      font-size: 11px; color: var(--text-dim); letter-spacing: 0.08em;
      font-family: var(--font-mono); padding: 0 8px;
    }

    .news-empty {
      text-align: center; padding: 80px 24px; color: var(--text-muted); font-size: 14px;
    }

    @media (max-width: 768px) {
      .news-hero { padding: 120px 20px 60px; min-height: 40vh; }
      .news-item { padding: 28px 0; }
      .news-item-title { font-size: 20px; }
    }
  </style>
</head>
<body>

<div class="nv-grain"></div>

<nav>
  <div class="nav-logo">
    <a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none">
      <div class="nav-logomark">V</div>
      <span class="nav-name">NEXVAULT</span>
    </a>
    <a href="/whitepaper" class="nav-pill-link">WHITEPAPER</a>
    <a href="/about" class="nav-pill-link">ABOUT US</a>
    <a href="/security" class="nav-pill-link">SECURITY</a>
    <a href="/nexcredit" class="nav-pill-link">NEXCREDIT</a>
  </div>
  <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
    <div class="dot-live"></div>
    <a href="/app" class="nav-launch-btn">◈ OPEN VAULT</a>
  </div>
</nav>

<!-- Hero -->
<section class="news-hero">
  <div class="news-hero-content">
    <div class="label label-gold fi fi1" style="margin-bottom:20px">NEWS &amp; INSIGHTS</div>
    <h1 class="hlg fi fi2">News</h1>
  </div>
</section>

<!-- Filter Bar -->
<div class="filter-bar fi fi3">
  <button class="filter-btn active" data-tag="all">ALL</button>
  <button class="filter-btn" data-tag="protocol">PROTOCOL</button>
  <button class="filter-btn" data-tag="defi">DEFI</button>
  <button class="filter-btn" data-tag="market">MARKET</button>
  <button class="filter-btn" data-tag="education">EDUCATION</button>
  <button class="filter-btn" data-tag="security">SECURITY</button>
  <button class="filter-btn" data-tag="ai">AI</button>
</div>

<!-- Article List -->
<div class="news-list" id="news-list"></div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<!-- Empty state -->
<div class="news-empty" id="news-empty" style="display:none">No articles found.</div>

<footer>© 2026 NEXVAULT · BUILT ON NEXUS.XYZ</footer>

<script>
// ── Load articles from _posts_data.json ──
const PER_PAGE = 15;
let allPosts = [];
let currentTag = 'all';
let currentPage = 1;

async function loadPosts() {
  try {
    const res = await fetch('/_posts_data.json');
    allPosts = await res.json();
    renderPage();
  } catch (e) {
    console.error('Failed to load posts:', e);
    document.getElementById('news-empty').style.display = '';
  }
}

function getFiltered() {
  return allPosts.filter(p => currentTag === 'all' || p.tag === currentTag);
}

function renderPage() {
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const start = (currentPage - 1) * PER_PAGE;
  const end = start + PER_PAGE;
  const pageItems = filtered.slice(start, end);

  const list = document.getElementById('news-list');
  const empty = document.getElementById('news-empty');

  if (!filtered.length) {
    list.innerHTML = '';
    empty.style.display = '';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = pageItems.map(function(post) {
    return '<a class="news-item" href="/post?id=' + post.id + '" id="post-' + post.id + '">' +
      '<div class="news-item-meta">' +
        '<span class="tag-pill tag-' + post.tag + '">' + post.tag.toUpperCase() + '</span>' +
        '<span class="news-item-date">' + post.date + '</span>' +
      '</div>' +
      '<div class="news-item-title">' + post.title + '</div>' +
    '</a>';
  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages <= 1) return;

  var prev = document.createElement('button');
  prev.className = 'page-btn'; prev.textContent = '\u2190';
  if (currentPage === 1) prev.disabled = true;
  prev.onclick = function() { currentPage--; renderPage(); scrollToList(); };
  pg.appendChild(prev);

  for (var i = 1; i <= totalPages; i++) {
    var btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.onclick = (function(p) { return function() { currentPage = p; renderPage(); scrollToList(); }; })(i);
    pg.appendChild(btn);
  }

  var next = document.createElement('button');
  next.className = 'page-btn'; next.textContent = '\u2192';
  if (currentPage === totalPages) next.disabled = true;
  next.onclick = function() { currentPage++; renderPage(); scrollToList(); };
  pg.appendChild(next);

  var info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = 'PAGE ' + currentPage + ' OF ' + totalPages;
  pg.appendChild(info);
}

function scrollToList() {
  document.getElementById('news-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Filter buttons ──
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTag = btn.dataset.tag;
    currentPage = 1;
    renderPage();
    scrollToList();
  });
});

// ── Init ──
loadPosts();
</script>
</body>
</html>
