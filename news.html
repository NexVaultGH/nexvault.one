  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/nv-cyber.css?v=3">

  <style>
    /* ── Hero ── */
    .news-hero {
      min-height: 50vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 140px 24px 80px; position: relative; z-index: 1;
    }
    .news-hero-content { max-width: 680px; }

    /* ── Filter bar ── */
    .filter-bar {
      max-width: 900px; margin: 0 auto 48px; padding: 0 24px;
      display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
      position: relative; z-index: 2;
    }
    .filter-btn {
      padding: 7px 18px; border-radius: 3px;
      border: 1px solid rgba(0,240,255,.1); background: transparent;
      color: var(--muted); font-family: var(--font); font-size: 11px;
      letter-spacing: .1em; font-weight: 500; cursor: pointer;
      transition: all .3s;
    }
    .filter-btn:hover {
      border-color: rgba(0,240,255,.25); color: var(--text);
      text-shadow: 0 0 6px rgba(0,240,255,.2);
    }
    .filter-btn.active {
      border-color: var(--cyan); color: var(--cyan);
      background: rgba(0,240,255,.06);
      text-shadow: 0 0 8px rgba(0,240,255,.4);
      box-shadow: 0 0 12px rgba(0,240,255,.1);
    }

    /* ── Tag pills ── */
    .tag-pill {
      display: inline-block; padding: 3px 10px; border-radius: 3px;
      font-size: 9px; letter-spacing: .14em; font-weight: 700;
    }
    .tag-protocol {
      background: rgba(0,240,255,.08); color: var(--cyan);
      text-shadow: 0 0 6px rgba(0,240,255,.3);
    }
    .tag-defi {
      background: rgba(201,168,76,.08); color: var(--magenta);
      text-shadow: 0 0 6px rgba(201,168,76,.3);
    }
    .tag-market {
      background: rgba(57,255,20,.06); color: var(--neon-green);
      text-shadow: 0 0 6px rgba(57,255,20,.3);
    }
    .tag-education {
      background: rgba(56,189,248,.08); color: #38bdf8;
      text-shadow: 0 0 6px rgba(56,189,248,.3);
    }
    .tag-security {
      background: rgba(239,68,68,.08); color: #f87171;
      text-shadow: 0 0 6px rgba(239,68,68,.3);
    }
    .tag-ai {
      background: rgba(168,85,247,.08); color: #c084fc;
      text-shadow: 0 0 6px rgba(168,85,247,.3);
    }

    /* ── Article list ── */
    .news-list {
      max-width: 900px; margin: 0 auto; padding: 0 24px;
      position: relative; z-index: 2;
    }

    .news-item {
      display: block; padding: 40px 0;
      border-bottom: 1px solid rgba(0,240,255,.06);
      text-decoration: none; transition: all .3s;
      position: relative;
    }
    .news-item:first-child { border-top: 1px solid rgba(0,240,255,.06); }
    .news-item:hover { padding-left: 12px; }
    .news-item::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 0; background: var(--cyan); transition: width .3s;
      box-shadow: 0 0 8px var(--cyan);
    }
    .news-item:hover::before { width: 2px; }

    .news-item-meta {
      display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    }

    .news-item-date {
      font-size: 11px; color: var(--dim); letter-spacing: .06em;
    }

    .news-item-title {
      font-family: var(--font-display); font-weight: 300;
      font-size: clamp(20px, 3vw, 32px);
      color: var(--text); line-height: 1.25; letter-spacing: -0.01em;
      transition: color .3s;
    }
    .news-item:hover .news-item-title {
      color: var(--text-bright);
      text-shadow: 0 0 12px rgba(0,240,255,.15);
    }

    /* ── Pagination ── */
    .pagination {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-top: 64px; padding: 0 24px 80px; flex-wrap: wrap;
      position: relative; z-index: 2;
    }
    .page-btn {
      width: 40px; height: 40px; border-radius: 4px;
      border: 1px solid rgba(0,240,255,.1); background: transparent;
      color: var(--muted); font-family: var(--font); font-size: 12px;
      font-weight: 500; cursor: pointer; transition: all .3s;
      display: flex; align-items: center; justify-content: center;
    }
    .page-btn:hover {
      border-color: rgba(0,240,255,.3); color: var(--text);
      box-shadow: 0 0 10px rgba(0,240,255,.1);
    }
    .page-btn.active {
      border-color: var(--cyan); color: var(--cyan);
      background: rgba(0,240,255,.06);
      box-shadow: 0 0 15px rgba(0,240,255,.15);
      text-shadow: 0 0 6px rgba(0,240,255,.4);
    }
    .page-btn:disabled {
      opacity: 0.2; cursor: default; pointer-events: none;
    }
    .page-info {
      font-size: 11px; color: var(--dim); letter-spacing: .1em; padding: 0 8px;
    }

    .news-empty {
      text-align: center; padding: 80px 24px; color: var(--muted); font-size: 14px;
      position: relative; z-index: 2;
    }

    @media (max-width: 768px) {
      .news-hero { padding: 120px 20px 60px; min-height: 40vh; }
      .news-item { padding: 28px 0; }
      .news-item-title { font-size: 20px; }
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="cyber-loader">
  <div class="cl-mark">V</div>
  <div class="cl-bar"><div class="cl-fill" id="cl-fill"></div></div>
  <div class="cl-pct" id="cl-pct">0 %</div>
</div>

<!-- Grid Background -->
<canvas id="cyber-grid"></canvas>

<!-- Nav -->
<nav class="c-nav">
  <a href="/" class="c-nav-logo">
    <div class="c-nav-mark">V</div>
    <span class="c-nav-word">NEXVAULT</span>
  </a>
  <div class="c-nav-links">
    <a href="/security" class="c-nav-link">SECURITY</a>
    <a href="/nexcredit" class="c-nav-link">NEXCREDIT</a>
    <a href="/about" class="c-nav-link">ABOUT</a>
    <a href="/whitepaper" class="c-nav-link">WHITEPAPER</a>
    <a href="/app" class="c-nav-cta">OPEN VAULT</a>
  </div>
</nav>

<!-- Hero -->
<section class="news-hero">
  <div class="news-hero-content">
    <div class="c-label rv">NEWS &amp; INSIGHTS</div>
    <h1 class="c-title rv rv-d1"><em>News</em></h1>
  </div>
</section>

<!-- Filter Bar -->
<div class="filter-bar rv rv-d2">
  <button class="filter-btn active" data-tag="all">ALL</button>
  <button class="filter-btn" data-tag="protocol">PROTOCOL</button>
  <button class="filter-btn" data-tag="defi">DEFI</button>
  <button class="filter-btn" data-tag="market">MARKET</button>
  <button class="filter-btn" data-tag="education">EDUCATION</button>
  <button class="filter-btn" data-tag="security">SECURITY</button>
  <button class="filter-btn" data-tag="ai">AI</button>
</div>

<!-- Article List -->
<div class="news-list" id="news-list"></div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<!-- Empty state -->
<div class="news-empty" id="news-empty" style="display:none">No articles found.</div>

<!-- Footer -->
<footer class="c-footer">
  <span class="c-footer-copy">&copy; 2026 NexVault</span>
  <div class="c-footer-links">
    <a href="/about">About</a>
    <a href="/security">Security</a>
    <a href="/nexcredit">NexCredit</a>
    <a href="/proof">Proof</a>
    <a href="/news">News</a>
    <a href="/whitepaper">Whitepaper</a>
    <a href="/terms">Terms</a>
  </div>
</footer>

<script src="/nv-cyber.js?v=3"></script>
<script>
// ── Load articles from _posts_data.json ──
const PER_PAGE = 15;
let allPosts = [];
let currentTag = 'all';
let currentPage = 1;

async function loadPosts() {
  try {
    const res = await fetch('/_posts_data.json');
    allPosts = await res.json();
    renderPage();
  } catch (e) {
    console.error('Failed to load posts:', e);
    document.getElementById('news-empty').style.display = '';
  }
}

function getFiltered() {
  return allPosts.filter(p => currentTag === 'all' || p.tag === currentTag);
}

function renderPage() {
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const start = (currentPage - 1) * PER_PAGE;
  const end = start + PER_PAGE;
  const pageItems = filtered.slice(start, end);

  const list = document.getElementById('news-list');
  const empty = document.getElementById('news-empty');

  if (!filtered.length) {
    list.innerHTML = '';
    empty.style.display = '';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = pageItems.map(function(post) {
    return '<a class="news-item" href="/post?id=' + post.id + '" id="post-' + post.id + '">' +
      '<div class="news-item-meta">' +
        '<span class="tag-pill tag-' + post.tag + '">' + post.tag.toUpperCase() + '</span>' +
        '<span class="news-item-date">' + post.date + '</span>' +
      '</div>' +
      '<div class="news-item-title">' + post.title + '</div>' +
    '</a>';
  }).join('');

  renderPagination(totalPages);
}

function renderPagination(totalPages) {
  const pg = document.getElementById('pagination');
  pg.innerHTML = '';
  if (totalPages <= 1) return;

  var prev = document.createElement('button');
  prev.className = 'page-btn'; prev.textContent = '\u2190';
  if (currentPage === 1) prev.disabled = true;
  prev.onclick = function() { currentPage--; renderPage(); scrollToList(); };
  pg.appendChild(prev);

  for (var i = 1; i <= totalPages; i++) {
    var btn = document.createElement('button');
    btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
    btn.textContent = i;
    btn.onclick = (function(p) { return function() { currentPage = p; renderPage(); scrollToList(); }; })(i);
    pg.appendChild(btn);
  }

  var next = document.createElement('button');
  next.className = 'page-btn'; next.textContent = '\u2192';
  if (currentPage === totalPages) next.disabled = true;
  next.onclick = function() { currentPage++; renderPage(); scrollToList(); };
  pg.appendChild(next);

  var info = document.createElement('span');
  info.className = 'page-info';
  info.textContent = 'PAGE ' + currentPage + ' OF ' + totalPages;
  pg.appendChild(info);
}

function scrollToList() {
  document.getElementById('news-list').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── Filter buttons ──
document.querySelectorAll('.filter-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTag = btn.dataset.tag;
    currentPage = 1;
    renderPage();
    scrollToList();
  });
});

// ── Init ──
loadPosts();
</script>
</body>
</html>
