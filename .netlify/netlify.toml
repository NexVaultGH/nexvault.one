[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), accelerometer=(), gyroscope=(), magnetometer=(), browsing-topics=()"
X-XSS-Protection = "1; mode=block"
X-Permitted-Cross-Domain-Policies = "none"
Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Resource-Policy = "same-origin"
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://api.qrserver.com; connect-src 'self' https://mainnet.rpc.nexus.xyz wss://mainnet.rpc.nexus.xyz https://testnet.rpc.nexus.xyz wss://testnet.rpc.nexus.xyz https://*.walletconnect.com wss://*.walletconnect.com https://*.walletconnect.org wss://*.walletconnect.org https://*.reown.com wss://*.reown.com https://api.qrserver.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self'; frame-src 'self'; upgrade-insecure-requests"

[[headers]]
for = "/nv-design.css"

[headers.values]
Cache-Control = "no-cache, must-revalidate"

[[headers]]
for = "/nv-core.js"

[headers.values]
